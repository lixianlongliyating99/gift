/* ==== 字体结束 ==== */

:root{
  --cardbg:rgba(255,255,255,.065); --cardline:rgba(255,255,255,.16);
  --bg1:#1A0E1E; --bg2:#2A1428; --gold:#E8C07D; --rose:#E8B4B8;
  --cream:#F3E9DC; --dim:#A08C96;
  --name1:#FFF3DF; --name2:#E8C07D; --line:rgba(232,192,125,.45);
  --chip:rgba(232,192,125,.07); --chipon:rgba(232,192,125,.2);
  --btn:rgba(232,180,184,.4); --btnon:rgba(232,180,184,.14);
  --glow:rgba(232,192,125,.22); --radius:10px;
}
/* 米白 · 正式 */
body.t-light{--bg1:#FCFAF7;--bg2:#F1EAE0;--gold:#A8803F;--rose:#B9787A;--cream:#332C26;--dim:#8B8078;
  --cardbg:rgba(255,255,255,.72); --cardline:rgba(0,0,0,.13);
  --name1:#8A6A32;--name2:#B08A4A;--line:rgba(168,128,63,.45);--chip:rgba(168,128,63,.06);
  --chipon:rgba(168,128,63,.16);--btn:rgba(185,120,122,.45);--btnon:rgba(185,120,122,.14);--glow:rgba(168,128,63,.18)}
/* 蜜桃 · 可爱 */
body.t-peach{--bg1:#FFF3F0;--bg2:#FFE0E4;--gold:#E06A85;--rose:#F08CA0;--cream:#4A2C33;--dim:#B08A94;

/* 薄荷 · 清新 */

  --name1:#2E7D62;--name2:#3E9E7E;--line:rgba(62,158,126,.4);--chip:rgba(62,158,126,.06);
  --chipon:rgba(62,158,126,.16);--btn:rgba(111,192,166,.45);--btnon:rgba(111,192,166,.15);--glow:rgba(62,158,126,.18);--radius:14px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);
  color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Serif CJK SC","Songti SC","PingFang SC",serif;
  overflow:hidden;touch-action:manipulation;
  background-size:100% 100%;
}
/* 流动渐变 */
body.bg-flow{background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg1),var(--bg2));
  background-size:400% 400%;animation:flowbg 22s ease infinite}
@keyframes flowbg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
/* 呼吸光晕 */
body.bg-glow::before{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(45% 35% at 50% 35%,var(--glow),transparent 70%);
  animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.25);opacity:1}}
/* 星点飘动 */
body.bg-stars::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(2px 2px at 20% 30%,var(--gold),transparent),
    radial-gradient(2px 2px at 70% 60%,var(--rose),transparent),
    radial-gradient(1.5px 1.5px at 40% 80%,var(--gold),transparent),
    radial-gradient(1.5px 1.5px at 85% 20%,var(--rose),transparent);
  animation:twinkle 6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.7}}
#app{position:relative;z-index:1}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}
.screen{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 26px;
  padding-top:calc(32px + env(safe-area-inset-top));
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
  text-align:center;
}
.screen.on{display:flex;animation:fade .7s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 字体 ---------- */

/* ---------- 封面 ---------- */
.ornament{color:var(--gold);font-size:15px;letter-spacing:.5em;opacity:.8;margin-bottom:26px}
.to-line{color:var(--dim);font-size:15px;display:none;letter-spacing:.28em;margin-bottom:14px}
.name{font-size:42px;display:none;letter-spacing:.1em;line-height:1.35;margin:0 0 20px;
  background:linear-gradient(180deg,var(--name1),var(--name2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 32px rgba(232,192,125,.22)}
.date{color:var(--rose);font-size:16px;display:none;letter-spacing:.22em;margin-bottom:52px}
.tap{
  border:1px solid var(--line);background:var(--chip);
  color:var(--gold);border-radius:999px;padding:14px 34px;font-size:15px;
  letter-spacing:.22em;cursor:pointer;font-family:inherit;
  animation:breathe 2.6s ease-in-out infinite;
}
.tap:active{background:var(--chipon)}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}

/* ---------- 信封 ---------- */
.envelope{position:relative;width:min(78vw,300px);aspect-ratio:1.5/1;
  perspective:900px;margin-bottom:34px;cursor:pointer;z-index:2}
.env-body{position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(158deg,#FFF4F5,#F3D3D9 60%,#E9C3CB);
  box-shadow:0 22px 55px rgba(0,0,0,.32)}
.env-letter{position:absolute;left:7%;right:7%;top:6%;bottom:8%;z-index:2;
  border-radius:8px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:11%;
  box-shadow:0 6px 18px rgba(0,0,0,.12);
  transition:transform 1s cubic-bezier(.34,.9,.4,1) .4s}
.env-to{color:#B08A94;font-size:13px;letter-spacing:.3em;margin-bottom:8px}
.env-name{font-size:30px;letter-spacing:.1em;color:#8A5A66;font-weight:600;line-height:1.3}
.env-date{color:#B98A94;font-size:12px;letter-spacing:.16em;margin-top:10px}
.env-flap{position:absolute;left:0;right:0;top:0;height:52%;z-index:3;
  background:linear-gradient(158deg,#F7DDE2,#E7BAC3);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;border-radius:12px 12px 0 0;
  transition:transform .85s cubic-bezier(.4,0,.2,1);backface-visibility:hidden}
.env-seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;
  width:46px;height:46px;border-radius:50%;color:#E8C07D;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 28%,#9A5F5F,#5A2E2E 70%);
  box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 -2px 6px rgba(0,0,0,.3);
  transition:opacity .35s,transform .45s}
.envelope.open .env-flap{transform:rotateX(-176deg)}
.envelope.open .env-letter{transform:translateY(-58%) scale(.96)}
.envelope.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(28deg)}
.envelope.open .env-body{box-shadow:0 10px 30px rgba(0,0,0,.22)}
.tap-hint{color:var(--dim);font-size:14px;letter-spacing:.28em;
  animation:breathe 2.6s ease-in-out infinite;transition:opacity .4s}
.reveal .tap-hint{opacity:0}

/* ---------- 回忆卡片 ---------- */
#s-cards{justify-content:center}
.card-count{color:var(--dim);font-size:12px;letter-spacing:.3em;margin-bottom:20px}
.card-title{color:var(--gold);font-size:24px;letter-spacing:.08em;margin:0 0 20px}
.card-body{
  font-size:19px;line-height:2.15;color:var(--cream);max-width:26em;
  white-space:pre-wrap;text-align:left;
}
.next{
  margin-top:44px;border:1px solid var(--btn);border-radius:999px;background:transparent;
  color:var(--rose);border-radius:999px;padding:12px 30px;font-size:14px;
  letter-spacing:.2em;cursor:pointer;font-family:inherit;
}
.next:active{background:var(--btnon)}
.card-photo{margin:0 auto 20px;max-width:78%}
.card-photo img{width:100%;display:block;border-radius:var(--radius);
  box-shadow:0 8px 26px rgba(0,0,0,.28)}
body.t-light .card-photo img{box-shadow:0 8px 26px rgba(90,70,50,.18)}
.card{animation:rise .6s ease both;display:flex;gap:22px;
  padding:26px 22px;border-radius:var(--radius);
  transition:background-color .3s,box-shadow .3s}
.card-text{display:flex;flex-direction:column;min-width:0;flex:1}
.card-title{margin-top:0}
/* ---- 布局 ---- */
body.ly-photo-top .card{flex-direction:column}
body.ly-photo-top .card-photo{order:1}
body.ly-photo-top .card-text{order:2}
body.ly-photo-bottom .card{flex-direction:column}
body.ly-photo-bottom .card-text{order:1}
body.ly-photo-bottom .card-photo{order:2}
body.ly-photo-left .card{flex-direction:row;align-items:flex-start}
body.ly-photo-left .card-photo{order:1;flex:0 0 40%;max-width:40%;margin:0}
body.ly-photo-left .card-text{order:2}
body.ly-photo-left .card-title{font-size:20px;margin-bottom:12px}

    b.classList.add('f-' + (GIFT.font || 'sans'));
    var dcs = ['dc-none','dc-flower','dc-paw','dc-leaf','dc-heart'];
    for (i = 0; i < dcs.length; i++) b.classList.remove(dcs[i]);
    b.classList.add('dc-' + (GIFT.deco || 'none'));
  }

  function renderCover() {
    $('cover-to').textContent = '给';
    $('cover-name').textContent = GIFT.to;
    $('cover-date').textContent = GIFT.date;
    document.title = '给 ' + GIFT.to + ' 的礼物';
  }

  function renderCard() {
    var c = GIFT.cards[idx];
    $('card-title').textContent = c.t;
    $('card-body').textContent = c.d;
    var ph = $('card-photo');
    if (c.photo) { ph.innerHTML = '<img alt="" src="' + c.photo + '">'; ph.style.display = 'block'; }
    else { ph.innerHTML = ''; ph.style.display = 'none'; }
    $('card-count').textContent = (idx + 1) + ' / ' + GIFT.cards.length;
    var next = $('btn-next');
    next.textContent = idx === GIFT.cards.length - 1 ? '接 下 来' : '继 续';
    var card = $('card');
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = '';
  }

  function renderWish() {
    $('wish-text').textContent = GIFT.wish;
    $('wish-sign').textContent = '—— ' + GIFT.from;
    $('wish-date').textContent = GIFT.date;
  }

  function startHearts() {
    if (heartsTimer) return;
    var box = $('hearts');
    var chars = ['♥', '✦', '❤', '✧'];
    heartsTimer = setInterval(function () {
      if (box.childElementCount > 26) return;
      var s = document.createElement('span');
      s.className = 'heart';
      s.textContent = chars[Math.floor(Math.random() * chars.length)];
      s.style.left = (Math.random() * 96) + '%';
      s.style.color = Math.random() > 0.5 ? '#E8B4B8' : '#E8C07D';
      s.style.fontSize = (12 + Math.random() * 14) + 'px';
      s.style.animationDuration = (7 + Math.random() * 6) + 's';
      box.appendChild(s);
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 14000);
    }, 520);
  }

  /* ---- 音乐：用 Web Audio 现场合成，不加载任何音频文件 ---- */
  var loopTimer = null;
  function playMusic() {
    if (muted) return;
    var song = SONGS[GIFT.song] || SONGS.birthday;
    if (!song || !song.notes || !song.notes.length) return;
    var inst = INST[GIFT.inst] || INST.musicbox;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audio = audio || new Ctx();
      if (audio.state === 'suspended') audio.resume();
      var master = audio.createGain();
      master.gain.value = (GIFT.volume == null ? 1 : GIFT.volume);
      master.connect(audio.destination);
      var beat = song.bpm / (GIFT.tempo || 1);
      var t = audio.currentTime + 0.12;
      var n = song.notes, peak = 0.15;
      for (var i = 0; i + 1 < n.length; i += 2) {
        var freq = NOTE[n[i]];
        var dur = n[i + 1] * beat;
        if (!freq) continue;
        var osc = audio.createOscillator(), g = audio.createGain();
        osc.type = inst.wave;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + inst.atk);
        if (inst.sus > 0) {
          g.gain.exponentialRampToValueAtTime(peak * inst.sus, t + inst.atk + dur * .5);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 1.15);
        } else {
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur * .95);
        }
        if (inst.harm > 0) {
          var o2 = audio.createOscillator(), g2 = audio.createGain();
          o2.type = 'sine'; o2.frequency.value = freq * 2;
          g2.gain.setValueAtTime(0.0001, t);
          g2.gain.exponentialRampToValueAtTime(peak * inst.harm, t + inst.atk);
          g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * .9);
          o2.connect(g2); g2.connect(master);
          o2.start(t); o2.stop(t + dur * 1.2);
        }
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + dur * 1.25);
        t += dur;
      }
      var total = t - audio.currentTime;
      clearTimeout(loopTimer);
      loopTimer = setTimeout(function () { if (!muted) playMusic(); }, (total + 2.0) * 1000);
    } catch (e) { /* 不支持就安静 */ }
  }

  function updateMute() {
    $('mute').textContent = muted ? '♪̸' : '♪';
    $('mute').style.color = muted ? '#6B5A63' : '#E8C07D';
  }

  var opened = false;
  $('envelope').addEventListener('click', function () {
    if (opened) return;
    opened = true;
    if (!muted) playMusic();
    this.classList.add('open');
    $('s-cover').classList.add('reveal');
    setTimeout(function () {
      idx = 0;
      renderCard();
      show('s-cards');
    }, 1500);
  });

  $('btn-next').addEventListener('click', function () {
    if (idx < GIFT.cards.length - 1) {
      idx++;
      renderCard();
    } else {
      $('claim-sub').textContent = GIFT.date;
      show('s-claim');
    }
  });

  $('giftbox').addEventListener('click', function () {
    var box = $('giftbox');
    if (box.classList.contains('open')) return;
    box.classList.add('open');
    setTimeout(function () {
      renderWish();
      startHearts();
      show('s-wish');
    }, 520);
  });

  $('mute').addEventListener('click', function () {
    muted = !muted;
    updateMute();
    if (!muted) playMusic();
  });

  $('btn-more').addEventListener('click', function () {
    var text = '这个礼物页是用手机做的，可以换成你们的故事。想做一个的话找我：' + GIFT.from;
    if (navigator.share) {
      navigator.share({title: '定制礼物页', text: text}).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        $('btn-more').textContent = '已 复 制，去 粘 贴 给 我';
      }).catch(function () {
        $('btn-more').textContent = text;
      });
    } else {
      $('btn-more').textContent = text;
    }
  });

  applyTheme();
  renderCover();
  renderWish();
  updateMute();
})();
</script>
</body>
</html>
