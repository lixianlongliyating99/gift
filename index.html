<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>礼物页生成器</title>
<meta name="theme-color" content="#1A0E1E">
<style>
:root{--bg:#140B18;--panel:#1F1224;--line:#3A2438;--gold:#E8C07D;--rose:#E8B4B8;
  --cream:#F3E9DC;--dim:#9C8892;--ok:#7FC8A9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 4px;letter-spacing:.06em}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px;line-height:1.7}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--gold);margin:0 0 6px;letter-spacing:.04em}
label .opt{color:var(--dim);font-weight:400}
input,textarea{width:100%;background:#120A16;border:1px solid var(--line);border-radius:8px;
  color:var(--cream);padding:11px 12px;font-size:15px;font-family:inherit;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical;min-height:74px}
.row{margin-bottom:14px}
.row:last-child{margin-bottom:0}
.hint{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cardhead h3{margin:0;font-size:14px;color:var(--rose);font-weight:500}
.del{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;
  padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.del:active{border-color:var(--rose);color:var(--rose)}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:0;font-size:16px;
  font-family:inherit;cursor:pointer;margin-top:10px;letter-spacing:.06em}
.btn.primary{background:linear-gradient(180deg,#E8C07D,#C99C55);color:#2A1428;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream)}
.btn:active{opacity:.85}
.seg{display:flex;gap:8px}
.segbtn{flex:1;padding:11px 8px;border-radius:8px;border:1px solid var(--line);
  background:#120A16;color:var(--dim);font-size:14px;font-family:inherit;cursor:pointer}
.segbtn.on{border-color:var(--gold);color:var(--gold);background:#1E1224}
.seg.wrap{flex-wrap:wrap}
.seg.wrap .segbtn{flex:0 0 calc(25% - 6px);padding:10px 4px;font-size:13px}
.photo-wrap{margin-top:8px;display:flex;align-items:center;gap:10px}
.photo-wrap img{width:56px;height:56px;object-fit:cover;border-radius:8px;display:none}
.photo-wrap .pbtn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:#120A16;color:var(--dim);font-size:13px;cursor:pointer;font-family:inherit}
.photo-wrap input[type=file]{display:none}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--cream)}
.switch input{width:auto}
#btnPreview{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;
  padding:12px 18px;border-radius:999px;border:1px solid var(--gold);background:#1E1224;
  color:var(--gold);font-size:14px;font-family:inherit;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
#previewOverlay{position:fixed;inset:0;z-index:70;display:none;
  background:rgba(6,3,8,.94);align-items:center;justify-content:center;padding:20px}
#previewOverlay.on{display:flex}
.pvbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
#previewCard{display:none}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;
  background:var(--bg);padding:10px 0 12px;margin-bottom:4px}
.tab{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line);
  background:#120A16;color:var(--dim);font-size:14px;font-family:inherit;cursor:pointer}
.tab.on{border-color:var(--gold);color:var(--gold);background:#1E1224;font-weight:600}
.pane{display:none}
.pane.on{display:block}
#bottom{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,transparent,var(--bg) 26%);
  padding:14px 0 calc(6px + env(safe-area-inset-bottom))}
.phone{width:100%;max-width:280px;margin:6px auto 0;aspect-ratio:9/19.2;
  border:6px solid #3A2438;border-radius:26px;overflow:hidden;background:#000;
  box-shadow:0 14px 34px rgba(0,0,0,.45)}
.phone iframe{width:100%;height:100%;border:0;display:block}
.prev-hint{text-align:center;color:var(--dim);font-size:12px;margin-top:9px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px);background:#2A1428;border:1px solid var(--gold);
  color:var(--cream);padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;
  pointer-events:none;transition:.22s;z-index:99;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.steps{counter-reset:s;font-size:13px;color:var(--dim);line-height:1.9;padding-left:0;
  list-style:none;margin:8px 0 0}
.steps li{counter-increment:s}
.steps li:before{content:counter(s)".";color:var(--gold);margin-right:7px}
</style>
</head>
<body>
<div class="wrap">
  <h1>礼物页生成器</h1>
  <div class="sub">填完下面的表，点一下，就得到你自己的礼物页。<br>不用注册，不用联网，不用会代码。</div>

  <div class="tabs">
    <button class="tab on" data-tab="content">✍ 内容</button>
    <button class="tab" data-tab="style">🎨 样式</button>
    <button class="tab" data-tab="music">🎵 音乐</button>
  </div>

  <!-- ==================== 内容 ==================== -->
  <div class="pane on" id="pane-content">
    <div class="card">
      <div class="row"><label>送给谁</label>
        <input id="f-to" placeholder="小雨" maxlength="12"></div>
      <div class="row"><label>什么日子</label>
        <input id="f-date" placeholder="5月20日 · 在一起一周年" maxlength="24"></div>
      <div class="row"><label>你的署名</label>
        <input id="f-from" placeholder="你的笨蛋" maxlength="16"></div>
    </div>

    <div id="cards"></div>
    <button class="btn ghost" id="add">＋ 再加一张卡片</button>

    <div class="card" style="margin-top:14px">
      <div class="row"><label>最后的祝福</label>
        <textarea id="f-wish" placeholder="一周年快乐。&#10;&#10;我不太会说好听的，就把我们的事写成了这个。"></textarea>
        <div class="hint">想换行就直接回车，不用管别的。</div></div>
    </div>

  </div>

  <!-- ==================== 样式 ==================== -->
  <div class="pane" id="pane-style">
    <div class="card">
      <div class="row"><label>套装 <span class="opt">（一键套用，8 套）</span></label>
        <div class="seg wrap" id="segSet"></div>
        <div class="hint">点一套就自动配好颜色+底纹+字体+背景+装饰，之后每项还能单独改</div>
      </div>
    </div>
    <div class="card">
      <div class="row"><label>配色 <span class="opt">（8 种）</span></label>
        <div class="seg wrap" id="segTheme">
          <button class="segbtn on" data-v="dark">深紫</button>
          <button class="segbtn" data-v="light">米白</button>
          <button class="segbtn" data-v="peach">蜜桃</button>
          <button class="segbtn" data-v="mint">薄荷</button>
          <button class="segbtn" data-v="sky">夜空</button>
          <button class="segbtn" data-v="sunset">落日</button>
          <button class="segbtn" data-v="lav">薰衣草</button>
          <button class="segbtn" data-v="ink">墨金</button>
        </div>
      </div>
      <div class="row"><label>背景动效 <span class="opt">（4 种）</span></label>
        <div class="seg wrap" id="segBg">
          <button class="segbtn on" data-v="still">静止</button>
          <button class="segbtn" data-v="flow">流动渐变</button>
          <button class="segbtn" data-v="glow">呼吸光晕</button>
          <button class="segbtn" data-v="stars">星点飘动</button>
        </div>
      </div>
      <div class="row"><label>字体 <span class="opt">（16 种）</span></label>
        <div class="seg wrap" id="segFont">
          <button class="segbtn" data-v="sans">黑体</button>
          <button class="segbtn" data-v="serif">宋体</button>
          <button class="segbtn" data-v="kai">楷体</button>
          <button class="segbtn" data-v="mono">等宽</button>
          <button class="segbtn" data-v="cute">可爱</button>
          <button class="segbtn" data-v="write">手写</button>
          <button class="segbtn on" data-v="hand">文楷</button>
          <button class="segbtn" data-v="maobi">毛笔</button>
          <button class="segbtn" data-v="xing">行书</button>
          <button class="segbtn" data-v="cao">草书</button>
          <button class="segbtn" data-v="sui">随性</button>
          <button class="segbtn" data-v="xiu">清秀</button>
          <button class="segbtn" data-v="huang">圆胖</button>
          <button class="segbtn" data-v="yozai">悠哉</button>
          <button class="segbtn" data-v="marker">漫黑</button>
          <button class="segbtn" data-v="neoxi">新晰黑</button>
        </div>
        <div class="hint">「黑体/宋体/楷体/等宽」用手机自带；后面 12 款是内置字体（SIL OFL 开源可商用），任何手机打开都一样</div>
      </div>
    </div>
    <div class="card">
      <div class="row"><label>卡片底纹 <span class="opt">（8 种）</span></label>
        <div class="seg wrap" id="segCard">
          <button class="segbtn on" data-v="none">无</button>
          <button class="segbtn" data-v="solid">浮层</button>
          <button class="segbtn" data-v="outline">描边</button>
          <button class="segbtn" data-v="line">横线纸</button>
          <button class="segbtn" data-v="grid">方格纸</button>
          <button class="segbtn" data-v="dot">波点</button>
          <button class="segbtn" data-v="star">星光</button>
          <button class="segbtn" data-v="paper">纸纹</button>
        </div>
      </div>
      <div class="row"><label>卡片布局 <span class="opt">（3 种）</span></label>
        <div class="seg" id="segLayout">
          <button class="segbtn on" data-v="photo-top">图上文下</button>
          <button class="segbtn" data-v="photo-bottom">文上图下</button>
          <button class="segbtn" data-v="photo-left">左图右文</button>
        </div>
      </div>
      <div class="row"><label>四角装饰 <span class="opt">（5 种）</span></label>
        <div class="seg wrap" id="segDeco">
          <button class="segbtn on" data-v="none">无</button>
          <button class="segbtn" data-v="flower">花边</button>
          <button class="segbtn" data-v="paw">小爪印</button>
          <button class="segbtn" data-v="leaf">叶子</button>
          <button class="segbtn" data-v="heart">爱心</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 音乐 ==================== -->
  <div class="pane" id="pane-music">
    <div class="card">
      <div class="row"><label>背景音乐 <span class="opt">（14 首，全是公版旋律）</span></label>
        <select id="f-song"></select>
        <div class="hint" id="songinfo"></div>
      </div>
      <div class="row"><label>音色 <span class="opt">（5 种）</span></label>
        <div class="seg wrap" id="segInst">
          <button class="segbtn on" data-v="musicbox">音乐盒</button>
          <button class="segbtn" data-v="piano">钢琴</button>
          <button class="segbtn" data-v="celesta">八音盒</button>
          <button class="segbtn" data-v="strings">弦乐</button>
          <button class="segbtn" data-v="synth">电子</button>
        </div>
      </div>
      <div class="row"><label>快慢</label>
        <input type="range" id="f-tempo" min="0.7" max="1.5" step="0.05" value="1" style="width:100%;padding:0">
        <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:4px">
          <span>慢</span><span id="tempoVal">正常</span><span>快</span></div>
      </div>
    </div>
  </div>

  <button id="btnPreview">👁 预览</button>
  <div id="previewOverlay">
    <div class="pvbox">
      <div class="phone"><iframe id="preview" title="预览"></iframe></div>
      <button class="btn ghost" id="closePreview">关 闭 预 览</button>
    </div>
  </div>

  <div id="bottom">  <button class="btn primary" id="link">生成专属链接（推荐）</button>
  <button class="btn ghost" id="gen">下载文件版</button></div>

  <div class="card" id="urltip" style="display:none;margin-top:14px">
    <label>你的专属链接（长按全选 → 复制）</label>
    <textarea rows="4" readonly onclick="this.select()"></textarea>
    <div class="hint">这条链接发给谁，谁就能看到你的礼物页。永久有效。</div>
    <div class="hint" id="leninfo"></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3 style="margin:0 0 4px;font-size:14px;color:var(--rose)">怎么把它送出去</h3>
    <ol class="steps">
      <li>点「生成专属链接」，链接会自动复制</li>
      <li>把链接粘贴给对方（微信 / QQ 都行）</li>
      <li>对方点开就能看，不用下载任何东西</li>
    </ol>
  </div>
</div>
</div>
<div id="toast"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  // 标签切换
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){ x.classList.remove('on'); });
      Array.prototype.forEach.call(document.querySelectorAll('.pane'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      document.getElementById('pane-' + b.dataset.tab).classList.add('on');
      window.scrollTo({top:0, behavior:'smooth'});
      if (b.dataset.tab === 'style') refreshPreview();
    });
  });
  // 套装按钮
  (function(){
    var box = $('segSet');
    Object.keys(SETS).forEach(function(k){
      var b = document.createElement('button');
      b.className = 'segbtn'; b.dataset.v = k; b.textContent = SETS[k].n;
      box.appendChild(b);
    });
    Array.prototype.forEach.call(box.querySelectorAll('.segbtn'), function(b){
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(box.querySelectorAll('.segbtn'), function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        var s = SETS[b.dataset.v];
        pick.theme = s.theme; pick.card = s.card; pick.font = s.font;
        pick.bg = s.bg; pick.deco = s.deco;
        // 同步界面上的选中态
        [['segTheme','theme'],['segBg','bg'],['segFont','font'],['segCard','card'],['segDeco','deco']]
          .forEach(function(p){
            var bx = $(p[0]); if (!bx) return;
            Array.prototype.forEach.call(bx.querySelectorAll('.segbtn'), function(x){
              x.classList.toggle('on', x.dataset.v === pick[p[1]]);
            });
          });
        refreshPreview(); updateLen();
      });
    });
  })();

  var cardSeq = 0, pick = { theme: 'dark', bg: 'still', font: 'hand', inst: 'musicbox', card: 'none', layout: 'photo-top', deco: 'none' };

  // 曲库下拉
  (function(){
    var sel = $('f-song');
    Object.keys(SONGS).forEach(function(k){
      if (k === 'none') return;
      var o = document.createElement('option');
      o.value = k; o.textContent = SONGS[k].name;
      sel.appendChild(o);
    });
    sel.value = 'birthday';
    var none = document.createElement('option');
    none.value = 'none'; none.textContent = '不要音乐';
    sel.appendChild(none);
    sel.addEventListener('change', function(){ refreshPreview(); info(); });
  })();
  function info(){
    var s = SONGS[$('f-song').value] || {};
    $('songinfo').textContent = ($('f-song').value === 'none')
      ? '不加音乐' : ('这首是公有领域旋律，可以放心商用');
  }
  $('f-tempo').addEventListener('input', function(){
    var v = parseFloat(this.value);
    $('tempoVal').textContent = v < .9 ? '慢' : (v > 1.15 ? '快' : '正常');
    refreshPreview();
  });
  (function(){
    var box = $('segInst');
    Array.prototype.forEach.call(box.querySelectorAll('.segbtn'), function(b){
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(box.querySelectorAll('.segbtn'), function(x){ x.classList.remove('on'); });
        b.classList.add('on'); pick.inst = b.dataset.v; refreshPreview();
      });
    });
  })();
  [['segTheme','theme'],['segBg','bg'],['segFont','font'],['segCard','card'],['segLayout','layout'],['segDeco','deco']].forEach(function(pair){
    var box = $(pair[0]);
    Array.prototype.forEach.call(box.querySelectorAll('.segbtn'), function(b){
      b.addEventListener('click', function(){
        Array.prototype.forEach.call(box.querySelectorAll('.segbtn'), function(x){ x.classList.remove('on'); });
        b.classList.add('on'); pick[pair[1]] = b.dataset.v; updateLen(); refreshPreview();
      });
    });
  });
  $('btnPreview').addEventListener('click', function(){
    $('previewCard') && ($('previewCard').style.display = 'block');
    refreshPreview();
    $('previewOverlay').classList.add('on');
  });
  $('closePreview').addEventListener('click', function(){
    $('previewOverlay').classList.remove('on');
  });
  $('previewOverlay').addEventListener('click', function(e){
    if (e.target === this) this.classList.remove('on');
  });

  var prevTimer = null;
  function refreshPreview(){
    clearTimeout(prevTimer);
    prevTimer = setTimeout(function(){
      var f = $('preview'); if (!f) return;
      try { f.srcdoc = build(); } catch(e) {}
    }, 180);
  }
  document.addEventListener('input', refreshPreview);
  document.addEventListener('change', refreshPreview);

  function updateLen(){
    var el = $('leninfo'); if (!el) return;
    var n = JSON.stringify(collect()).length;
    el.textContent = n < 3000 ? ('链接长度 ' + n + ' 字符，随便发')
      : n < 9000 ? ('链接长度 ' + n + ' 字符，有点长但能发')
      : ('链接长度 ' + n + ' 字符，太长了 —— 建议少放照片，或用「下载文件版」');
    el.style.color = n < 9000 ? 'var(--dim)' : '#E0A458';
  }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2800);
  }

  function addCard(title, body){
    var i = ++cardSeq;
    var box = document.createElement('div');
    box.className = 'card';
    box.innerHTML =
      '<div class="cardhead"><h3>第 ' + i + ' 张卡片</h3>' +
      '<button class="del">删除</button></div>' +
      '<div class="row"><label>标题</label>' +
      '<input class="c-t" placeholder="第一次见你" maxlength="16"></div>' +
      '<div class="row"><label>内容</label>' +
      '<textarea class="c-d" placeholder="去年冬天在图书馆，你占了我常坐的位置。&#10;我站在旁边看了你十分钟。"></textarea>' +
      '<div class="hint">越具体越好。别人听不懂的细节，才是最好的细节。</div></div>' +
      '<div class="row"><label>照片 <span class="opt">（可选）</span></label>' +
      '<div class="photo-wrap"><button class="pbtn">选择照片</button>' +
      '<img alt=""><input type="file" accept="image/*"></div></div>';
    (function(){
      var pbtn = box.querySelector('.pbtn'), pimg = box.querySelector('img'),
          pfile = box.querySelector('input[type=file]');
      pbtn.addEventListener('click', function(){ pfile.click(); });
      pfile.addEventListener('change', function(){
        var f = pfile.files && pfile.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function(){
          var im = new Image();
          im.onload = function(){
            var W = 320, sc = Math.min(1, W / im.width);
            var cv = document.createElement('canvas');
            cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
            cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
            var url = cv.toDataURL('image/webp', 0.62);
            if (url.indexOf('data:image/webp') !== 0) url = cv.toDataURL('image/jpeg', 0.55);
            box.dataset.photo = url; pimg.src = url; pimg.style.display = 'block';
            pbtn.textContent = '换一张';
            var n = document.querySelectorAll('#cards .card[data-photo]').length;
            if (n > 3) { delete box.dataset.photo; pimg.style.display='none'; pbtn.textContent='选择照片';
              toast('最多 3 张照片，链接会太长'); }
            updateLen();
          };
          im.src = fr.result;
        };
        fr.readAsDataURL(f);
      });
      box.querySelector('.pbtn2') && box.querySelector('.pbtn2').addEventListener('click', function(){
        delete box.dataset.photo; pimg.style.display='none'; pbtn.textContent='选择照片'; updateLen();
      });
    })();

    box.querySelector('.del').addEventListener('click', function(){
      if (document.querySelectorAll('#cards .card').length <= 1) { toast('至少留一张卡片'); return; }
      box.remove(); renumber();
    });
    $('cards').appendChild(box);
    if (title) box.querySelector('.c-t').value = title;
    if (body) box.querySelector('.c-d').value = body;
    renumber();
    if (typeof refreshPreview === 'function') refreshPreview();
    return box;
  }

  function renumber(){
    var all = document.querySelectorAll('#cards .card');
    for (var i = 0; i < all.length; i++){
      all[i].querySelector('h3').textContent = '第 ' + (i + 1) + ' 张卡片';
    }
    cardSeq = all.length;
  }

  function collect(){
    var cards = [];
    var all = document.querySelectorAll('#cards .card');
    for (var i = 0; i < all.length; i++){
      var t = all[i].querySelector('.c-t').value.trim();
      var d = all[i].querySelector('.c-d').value.trim();
      var c = { t: t || ('第 ' + (i + 1) + ' 件事'), d: d };
      if (all[i].dataset.photo) c.photo = all[i].dataset.photo;
      if (t || d || c.photo) cards.push(c);
    }
    if (!cards.length) cards.push({ t: '第一次见你', d: '这里写你们的故事。' });
    return {
      to: $('f-to').value.trim() || '你',
      date: $('f-date').value.trim() || '生日快乐',
      from: $('f-from').value.trim() || '',
      cards: cards,
      wish: $('f-wish').value.trim() || '希望你今年一切都好。',
      song: $('f-song').value,
      card: pick.card,
      layout: pick.layout,
      deco: pick.deco,
      inst: pick.inst,
      tempo: parseFloat($('f-tempo').value),
      theme: pick.theme, bg: pick.bg, font: pick.font
    };
  }

  function template(){
    var bin = atob(TPL_B64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function b64e(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function playerUrl(){
    return location.href.replace(/[^/]*$/, '') + 'gift.html#d=' + b64e(JSON.stringify(collect()));
  }

  function build(){
    var cfg = JSON.stringify(collect(), null, 2).replace(/<\//g, '<\\/');
    return template().replace(/var GIFT = \{[\s\S]*?\n\};/, 'var GIFT = ' + cfg + ';');
  }

  $('add').addEventListener('click', function(){
    if (document.querySelectorAll('#cards .card').length >= 8) { toast('最多 8 张'); return; }
    addCard();
  });
  $('link').addEventListener('click', function(){
    try {
      var url = playerUrl();
      if (url.length > 40000) { toast('内容太长了，减掉照片或卡片试试'); return; }
      var done = function(){ toast('链接已复制，发给对方就能看'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function(){ showUrl(url); });
      } else { showUrl(url); }
    } catch(e) { toast('生成失败：' + e.message); }
  });

  function showUrl(url){
    var box = $('urltip');
    box.style.display = 'block';
    box.querySelector('textarea').value = url;
    box.scrollIntoView({behavior:'smooth', block:'center'});
  }

  $('gen').addEventListener('click', function(){
    try {
      var html = build();
      var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
      var name = '给' + collect().to + '的礼物.html';
      if (!/\.html?$/i.test(name)) name += '.html';   // 后缀兜底：没有它买家打不开
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('已生成：' + name);
    } catch(e) {
      toast('生成失败：' + e.message);
    }
  });

  info();
  addCard('第一次见你', '去年冬天在图书馆，你占了我常坐的位置。\n我站在旁边看了你十分钟，最后憋出一句：同学，这个位子有人吗。');
  addCard('你哭的那天', '你考砸了，在操场看台上坐着不说话。\n我买了两瓶可乐，你说你不喝碳酸。然后你把两瓶都喝了。');
  addCard('我没告诉过你的事', '你每次说"没事"的时候，我都会偷偷看你一眼。\n三百多天，我看了三百多眼。');
  $('f-wish').value = '一周年快乐。\n\n我不太会说好听的，就把我们的事写成了这个。\n以后每年这一天，我都给你做一个新的。';
})();
</script>
</body>
</html>
