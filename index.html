<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>礼物页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 70% at 50% 0%,#241832 0%,#0E0A12 55%);
  color:#F2ECF5;text-align:center;padding:34px;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;
}
.box{max-width:330px}
.ico{margin-bottom:26px}
h1{font-size:19px;font-weight:600;letter-spacing:.06em;line-height:1.7}
p{color:#9A8FA8;font-size:14px;line-height:1.9;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="ico">
    <svg width="66" height="66" viewBox="0 0 24 24" fill="none"
         stroke="#E8C07D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2.5"/>
      <path d="M2 7.5 L12 13.5 L22 7.5"/>
      <path d="M2 18 L9 12.5 M22 18 L15 12.5"/>
    </svg>
  </div>
  <h1>这是一份礼物</h1>
  <p>请用你收到的那个链接打开<br>它长这样：<br>
     <span style="color:#E8C07D;font-size:12.5px">…/gift.html#d=…</span></p>
</div>
</body>
</html>
