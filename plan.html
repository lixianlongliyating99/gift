<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0E0A12">
<title>每日打卡</title>
<style>
:root{
  --bg:#0E0A12; --bg2:#171021; --line:rgba(255,255,255,.09);
  --ink:#F2ECF5; --dim:#9A8FA8; --gold:#E8C07D;
  --ok:#5FD39A; --ok2:#2E9E6B;
  --danger:#E06B7A;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(120% 70% at 50% 0%,#241832 0%,var(--bg) 55%) fixed;
  color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;
  padding:0 16px calc(30px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.wrap{max-width:520px;margin:0 auto}

/* ---------- 顶部 ---------- */
header{padding:26px 0 18px;text-align:center;position:relative}
.date{color:var(--dim);font-size:13px;letter-spacing:.22em}
.weekday{font-size:15px;color:var(--ink);margin-top:6px;font-weight:600;letter-spacing:.1em}

/* 进度环 */
.ring{position:relative;width:150px;height:150px;margin:22px auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.07)}
.ring .bar{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)}
.ring .num{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.ring .num b{font-size:36px;font-weight:700;line-height:1;letter-spacing:-.02em}
.ring .num span{font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:.14em}
.streak{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  padding:8px 16px;border-radius:999px;font-size:13px;
  background:rgba(232,192,125,.1);color:var(--gold);border:1px solid rgba(232,192,125,.22)
}
.streak b{font-size:16px}

/* ---------- 任务列表 ---------- */
.list{margin-top:26px;display:flex;flex-direction:column;gap:11px}
.item{
  position:relative;display:flex;align-items:center;gap:14px;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 16px;cursor:pointer;overflow:hidden;
  transition:transform .16s cubic-bezier(.4,0,.2,1),background .3s,border-color .3s;
}
.item:active{transform:scale(.975)}
.item .tick{
  flex:0 0 28px;width:28px;height:28px;border-radius:9px;
  border:2px solid rgba(255,255,255,.22);position:relative;
  transition:background .28s,border-color .28s,transform .28s
}
.item .tick svg{position:absolute;inset:0;width:100%;height:100%}
.item .tick path{
  fill:none;stroke:#0E0A12;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;
  transition:stroke-dashoffset .34s cubic-bezier(.4,0,.2,1) .1s
}
.item .txt{flex:1;min-width:0;font-size:16.5px;line-height:1.42;word-break:break-word}
.item .del{
  flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:none;
  background:rgba(224,107,122,.14);color:var(--danger);font-size:17px;
  display:none;align-items:center;justify-content:center;cursor:pointer
}
body.editing .item .del{display:flex}
body.editing .item{cursor:default}
body.editing .item:active{transform:none}

/* 已完成 */
.item.done{background:rgba(95,211,154,.09);border-color:rgba(95,211,154,.35)}
.item.done .tick{background:var(--ok);border-color:var(--ok);transform:scale(1.06)}
.item.done .tick path{stroke-dashoffset:0}
.item.done .txt{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(154,143,168,.5)}
.item.done::after{
  content:'';position:absolute;inset:0;border-radius:var(--r);
  background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(95,211,154,.4),transparent 60%);
  animation:burst .62s ease-out forwards;pointer-events:none
}
@keyframes burst{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}

/* 编辑输入框 */
.item input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--ink);font-size:16.5px;font-family:inherit
}

/* ---------- 粒子 ---------- */
.spark{
  position:fixed;pointer-events:none;z-index:99;
  width:8px;height:8px;border-radius:50%;
  animation:fly .85s cubic-bezier(.15,.7,.35,1) forwards
}
@keyframes fly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}
}

/* ---------- 全部完成 ---------- */
.celebrate{
  position:fixed;inset:0;z-index:120;display:none;
  align-items:center;justify-content:center;flex-direction:column;
  background:rgba(10,6,14,.9);backdrop-filter:blur(6px)
}
.celebrate.on{display:flex}
.celebrate .big{font-size:64px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-25deg);opacity:0}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.celebrate h2{font-size:25px;margin-top:20px;letter-spacing:.06em;animation:up .6s ease .18s both}
.celebrate p{color:var(--dim);margin-top:12px;font-size:14.5px;letter-spacing:.06em;animation:up .6s ease .3s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:130;pointer-events:none;animation:drop linear forwards}
@keyframes drop{
  0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:.15;transform:translateY(105vh) rotate(720deg)}
}

/* ---------- 底部按钮 ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 34%);
  display:flex;gap:10px;max-width:520px;margin:0 auto
}
.bar button{
  flex:1;padding:14px;border-radius:14px;font-size:15px;font-family:inherit;
  border:1px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer;
  transition:transform .14s
}
.bar button:active{transform:scale(.97)}
.bar button.main{border-color:rgba(232,192,125,.4);color:var(--gold);background:rgba(232,192,125,.1)}
.spacer{height:92px}

/* ---------- 最近 7 天 ---------- */
.week{margin-top:30px}
.week h3{font-size:12.5px;color:var(--dim);letter-spacing:.2em;margin-bottom:14px;font-weight:500}
.dots{display:flex;gap:9px}
.day{flex:1;text-align:center}
.day .box{
  aspect-ratio:1;border-radius:11px;background:var(--bg2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--dim);transition:background .3s,border-color .3s
}
.day .box.p1{background:rgba(95,211,154,.16);border-color:rgba(95,211,154,.3);color:var(--ok)}
.day .box.p2{background:rgba(95,211,154,.38);border-color:rgba(95,211,154,.55);color:#0E0A12;font-weight:700}
.day .box.p3{background:var(--ok);border-color:var(--ok);color:#0E0A12;font-weight:700}
.day .lb{font-size:10.5px;color:var(--dim);margin-top:6px}
.day.today .lb{color:var(--gold)}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:120px;transform:translate(-50%,16px);
  background:rgba(30,20,40,.97);border:1px solid var(--line);
  padding:12px 22px;border-radius:999px;font-size:14px;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .28s;z-index:200
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="date" id="date"></div>
    <div class="weekday" id="weekday"></div>

    <div class="ring">
      <svg width="150" height="150">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#5FD39A"/>
            <stop offset="100%" stop-color="#E8C07D"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="75" cy="75" r="64" fill="none" stroke-width="11"/>
        <circle class="bar" id="bar" cx="75" cy="75" r="64" fill="none" stroke-width="11"
                stroke-dasharray="402" stroke-dashoffset="402"/>
      </svg>
      <div class="num"><b id="pct">0</b><span>今日完成</span></div>
    </div>

    <div class="streak" id="streak"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" style="flex:0 0 auto"><path d="M12 2c1.2 4.2 5 5.4 5 10.2A5 5 0 0 1 7 12.2c0-2.1 1-3.3 2.1-4.3.1 2.1 1 3.1 2 3.1 0-3.1-.9-6 0.9-9z"/></svg> 连续 <b>0</b> 天</div>
  </header>

  <div class="list" id="list"></div>

  <div class="week">
    <h3>最近 7 天</h3>
    <div class="dots" id="dots"></div>
  </div>

  <div class="spacer"></div>
</div>

<div class="bar">
  <button id="btnEdit">编辑</button>
  <button id="btnAdd">＋ 加一条</button>
  <button class="main" id="btnReset">重置今天</button>
</div>

<div class="celebrate" id="celebrate">
  <div class="big">
    <svg viewBox="0 0 100 100" width="118" height="118">
      <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(95,211,154,.28)" stroke-width="5"/>
      <path d="M28 52 L44 68 L74 34" fill="none" stroke="#5FD39A" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="90" stroke-dashoffset="90">
        <animate attributeName="stroke-dashoffset" from="90" to="0"
                 dur="0.55s" begin="0.25s" fill="freeze" calcMode="spline"
                 keySplines="0.4 0 0.2 1"/>
      </path>
    </svg>
  </div>
  <h2>今天全部完成</h2>
  <p id="celebSub"></p>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   这里是任务清单 —— 你可以直接改，也可以在 APP 里点「编辑」改
   改完 APP 里点「加一条」「编辑」就能调整
   ============================================================ */
var PLAN = {
  version: 3,
  items: [
    { id: 'a1', t: '7:00 前起床' },
    { id: 'a2', t: '学习 2 小时' },
    { id: 'a3', t: '发 1 条内容（快手/小红书/闲鱼）' },
    { id: 'a4', t: '回完所有客户消息' },
    { id: 'a5', t: '运动 20 分钟' },
    { id: 'a6', t: '23:30 前睡觉' }
  ]
};
/* ============================================================ */

var FLAME_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" style="flex:0 0 auto"><path d="M12 2c1.2 4.2 5 5.4 5 10.2A5 5 0 0 1 7 12.2c0-2.1 1-3.3 2.1-4.3.1 2.1 1 3.1 2 3.1 0-3.1-.9-6 0.9-9z"/></svg>';
var LS_ITEMS = 'plan_items_v3';
var LS_LOG   = 'plan_log_v3';
var $ = function (id) { return document.getElementById(id); };

function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
       + '-' + String(d.getDate()).padStart(2, '0');
}
function load(k, fb) {
  try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; }
  catch (e) { return fb; }
}
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* 任务：本地有就用本地的，没有就用文件里的 PLAN */
var items = load(LS_ITEMS, null);
if (!items || !items.length) { items = PLAN.items.slice(); save(LS_ITEMS, items); }

var log = load(LS_LOG, {});          // { '2026-09-22': ['a1','a3'] }
var editing = false;

/* ---------------- 渲染 ---------------- */
function render() {
  var now = new Date(), key = todayKey(now);
  var wd = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
  $('date').textContent = (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日';
  $('weekday').textContent = wd;

  var done = log[key] || [];
  var list = $('list');
  list.innerHTML = '';

  items.forEach(function (it) {
    var el = document.createElement('div');
    var isDone = done.indexOf(it.id) >= 0;
    el.className = 'item' + (isDone ? ' done' : '');
    el.dataset.id = it.id;

    var tick = document.createElement('div');
    tick.className = 'tick';
    tick.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19 7"/></svg>';

    var txt = document.createElement('div');
    txt.className = 'txt';
    if (editing) {
      var inp = document.createElement('input');
      inp.value = it.t;
      inp.addEventListener('input', function () {
        it.t = inp.value; save(LS_ITEMS, items);
      });
      txt.appendChild(inp);
    } else {
      txt.textContent = it.t;
    }

    var del = document.createElement('button');
    del.className = 'del'; del.textContent = '×';
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      items = items.filter(function (x) { return x.id !== it.id; });
      save(LS_ITEMS, items); render(); toast('删掉了');
    });

    el.appendChild(tick); el.appendChild(txt); el.appendChild(del);

    if (!editing) {
      el.addEventListener('click', function (e) { toggle(it.id, el, e); });
    }
    list.appendChild(el);
  });

  updateRing();
  renderWeek();

  if (!items.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--dim);padding:40px 0;font-size:14px">'
      + '还没有任务，点下面「＋ 加一条」开始</div>';
  }
}

/* ---------------- 打卡 ---------------- */
function toggle(id, el, ev) {
  var key = todayKey();
  var done = log[key] || [];
  var i = done.indexOf(id);

  if (i >= 0) {                       // 取消
    done.splice(i, 1);
    log[key] = done; save(LS_LOG, log);
    el.classList.remove('done');
    updateRing(); renderWeek();
    return;
  }

  done.push(id); log[key] = done; save(LS_LOG, log);

  // 记录点击位置，让光晕从这里散开
  var r = el.getBoundingClientRect();
  var px = ((ev.clientX || r.left + r.width / 2) - r.left) / r.width * 100;
  var py = ((ev.clientY || r.top + r.height / 2) - r.top) / r.height * 100;
  el.style.setProperty('--px', px + '%');
  el.style.setProperty('--py', py + '%');

  el.classList.remove('done');
  void el.offsetWidth;                // 强制重排，动画才会重放
  el.classList.add('done');

  sparks(ev.clientX || r.left + r.width / 2, ev.clientY || r.top + r.height / 2);
  if (navigator.vibrate) navigator.vibrate(18);

  updateRing(); renderWeek();

  if ((log[key] || []).length === items.length && items.length) {
    setTimeout(celebrate, 420);
  }
}

function sparks(x, y) {
  var colors = ['#5FD39A', '#E8C07D', '#F2ECF5', '#8FE0BC'];
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('div');
    s.className = 'spark';
    var a = (Math.PI * 2 * i) / 14 + Math.random() * .5;
    var d = 55 + Math.random() * 75;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.background = colors[i % colors.length];
    s.style.setProperty('--dx', Math.cos(a) * d + 'px');
    s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.width = s.style.height = (5 + Math.random() * 6) + 'px';
    document.body.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 900); })(s);
  }
}

/* ---------------- 进度环 ---------------- */
function updateRing() {
  var key = todayKey();
  var n = (log[key] || []).length, total = items.length || 1;
  var pct = Math.round(n / total * 100);
  var C = 402;
  $('bar').style.strokeDashoffset = C - C * (n / total);
  $('pct').textContent = pct + '%';

  // 连续天数
  var streak = 0, d = new Date();
  if ((log[todayKey(d)] || []).length < items.length) d.setDate(d.getDate() - 1);
  while (items.length && (log[todayKey(d)] || []).length >= items.length) {
    streak++; d.setDate(d.getDate() - 1);
  }
  $('streak').innerHTML = FLAME_SVG + ' 连续 <b>' + streak + '</b> 天';
}

/* ---------------- 最近 7 天 ---------------- */
function renderWeek() {
  var box = $('dots'), out = '';
  var names = ['日','一','二','三','四','五','六'];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var k = todayKey(d), n = (log[k] || []).length, t = items.length || 1;
    var cls = 'box';
    if (t && n >= t) cls += ' p3';
    else if (n / t >= .6) cls += ' p2';
    else if (n > 0) cls += ' p1';
    out += '<div class="day' + (i === 0 ? ' today' : '') + '">'
         + '<div class="' + cls + '">' + (n || '') + '</div>'
         + '<div class="lb">' + (i === 0 ? '今天' : names[d.getDay()]) + '</div></div>';
  }
  box.innerHTML = out;
}

/* ---------------- 全部完成 ---------------- */
function celebrate() {
  var key = todayKey();
  var n = 0, d = new Date();
  d.setDate(d.getDate() - 1);
  while (items.length && (log[todayKey(d)] || []).length >= items.length) {
    n++; d.setDate(d.getDate() - 1);
  }
  $('celebSub').textContent = n > 0 ? ('已经连续 ' + (n + 1) + ' 天了，别断') : '明天继续';
  $('celebrate').classList.add('on');
  if (navigator.vibrate) navigator.vibrate([30, 60, 30, 60, 90]);

  var colors = ['#5FD39A', '#E8C07D', '#F2ECF5', '#B48FE0', '#8FE0BC'];
  for (var i = 0; i < 60; i++) {
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.7 + Math.random() * 1.5) + 's';
    c.style.animationDelay = (Math.random() * .5) + 's';
    c.style.borderRadius = Math.random() > .5 ? '2px' : '50%';
    document.body.appendChild(c);
    (function (el) { setTimeout(function () { el.remove(); }, 3800); })(c);
  }
  setTimeout(function () { $('celebrate').classList.remove('on'); }, 2900);
}
$('celebrate').addEventListener('click', function () { this.classList.remove('on'); });

/* ---------------- 按钮 ---------------- */
$('btnEdit').addEventListener('click', function () {
  editing = !editing;
  document.body.classList.toggle('editing', editing);
  this.textContent = editing ? '完成' : '编辑';
  render();
  if (editing) toast('直接点文字就能改');
});

$('btnAdd').addEventListener('click', function () {
  items.push({ id: 'c' + Date.now(), t: '新任务' });
  save(LS_ITEMS, items);
  if (!editing) {
    editing = true; document.body.classList.add('editing'); $('btnEdit').textContent = '完成';
  }
  render();
  var last = $('list').lastElementChild;
  if (last) { var inp = last.querySelector('input'); if (inp) { inp.focus(); inp.select(); } }
});

$('btnReset').addEventListener('click', function () {
  var key = todayKey();
  delete log[key]; save(LS_LOG, log);
  render(); toast('今天已重置');
});

/* ---------------- 提示 ---------------- */
var tmr;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tmr); tmr = setTimeout(function () { t.classList.remove('on'); }, 2000);
}

render();
</script>
</body>
</html>
